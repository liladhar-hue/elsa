[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elsa"
version = "0.1.0"
description = "Lightweight OT/ICS service inventory tool for authorized lab environments"
requires-python = ">=3.8"

[project.scripts]
elsa = "elsa.cli:main"

[tool.setuptools]
packages = ["elsa"]

[tool.setuptools.package-data]
elsa = ["data/*.json"]
